name: Release

# v* tag 是版本唯一来源：tag v1.2.3 → npm 包 1.2.3 + Release 资产 aforge.exe。
# 不要手改 package.json 的 version 再发布，两处版本必然漂移。
on:
  push:
    tags: ["v*"]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺少 NPM_TOKEN secret，无法发布。在仓库 Settings -> Secrets 添加 npm Automation token。"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck
      - run: npm run test

      # tag → package.json → src/version.ts（gen:version 由 build:node/prepack 触发）
      - name: Sync package version with tag
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build and verify bin
        run: |
          npm run build:node
          node dist/aforge.js --version

      # prepack 会再跑一次 build:node，产物与上面一致
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 带连字符的 tag（v1.0.0-rc.1 等）发到 next 频道，不抢占 latest
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --provenance --tag "$DIST_TAG"

  # 无 Node 环境的兜底分发：五平台单文件二进制挂到 GitHub Release。
  # bun --compile 支持交叉编译，所以编译只用一个 ubuntu runner；但交叉产物无法在
  # 编译机上冒烟，故拆出 smoke job 到各自平台的 runner 上跑 --version。
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Sync package version with tag
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: npm run build:bun:all

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/aforge-*
          if-no-files-found: error

  # linux-arm64 与 darwin-x64 无免费 runner，保持"编译产出但不冒烟"。
  smoke-binaries:
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: aforge-linux-x64
          - os: windows-latest
            bin: aforge-win32-x64.exe
          - os: macos-latest
            bin: aforge-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Run --version
        shell: bash
        run: |
          chmod +x "${{ matrix.bin }}"
          "./${{ matrix.bin }}" --version

  release-binaries:
    needs: smoke-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release

      - name: Package assets
        working-directory: release
        # 压缩后再挂 Release：单个二进制 64~90 MB（bun 运行时占绝大部分），
        # 压缩后 36~39 MB（实测 linux-x64 80→36 MB、win32-x64 86→39 MB），
        # 下载量少一半以上。checksums 覆盖压缩包本身。
        # tar 前先补执行位：upload/download-artifact 不保留 mode，
        # 不补的话解包出来的二进制在 POSIX 上不可执行。
        run: |
          chmod +x aforge-linux-* aforge-darwin-*
          for f in aforge-linux-* aforge-darwin-*; do
            tar -czf "$f.tar.gz" "$f"
            rm "$f"
          done
          # Windows 侧给 .zip（Explorer 双击即解）；runner 镜像自带 zip，
          # 缺失时退回 python3 stdlib，避免为一条打包命令依赖额外安装
          if command -v zip > /dev/null; then
            zip -q aforge-win32-x64.zip aforge-win32-x64.exe
          else
            python3 -m zipfile -c aforge-win32-x64.zip aforge-win32-x64.exe
          fi
          rm aforge-win32-x64.exe
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

