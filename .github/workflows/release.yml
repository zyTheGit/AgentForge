name: Release

# v* tag 是版本唯一来源：tag v1.2.3 → npm 包 1.2.3 + Release 资产（五平台二进制
# 压缩包 .tar.gz / .zip 与 checksums.txt）。
# 不要手改 package.json 的 version 再发布，两处版本必然漂移。
on:
  push:
    tags: ["v*"]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance 需要
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺少 NPM_TOKEN secret，无法发布。在仓库 Settings -> Secrets 添加 npm Automation token。"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck
      - run: npm run test

      # tag → package.json → src/version.ts（gen:version 由 build:node/prepack 触发）
      - name: Sync package version with tag
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build and verify bin
        run: |
          npm run build:node
          node dist/aforge.js --version

      # prepack 会再跑一次 build:node，产物与上面一致
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 带连字符的 tag（v1.0.0-rc.1 等）发到 next 频道，不抢占 latest
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --provenance --tag "$DIST_TAG"

  # 无 Node 环境的兜底分发：五平台单文件二进制挂到 GitHub Release。
  # bun --compile 支持交叉编译，所以编译只用一个 ubuntu runner；但交叉产物无法在
  # 编译机上冒烟，故拆出 smoke job 到各自平台的 runner 上跑 --version。
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      smoke: ${{ steps.smoke-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci

      - name: Sync package version with tag
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: npm run build:bun:all

      # 冒烟矩阵由 scripts/build-bun.mjs 的 TARGETS 唯一决定，不在 YAML 里再抄一遍平台清单
      - name: Export smoke matrix
        id: smoke-matrix
        run: echo "matrix=$(node scripts/build-bun.mjs --list)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/aforge-*
          if-no-files-found: error

  # 冒烟矩阵来自 build-bun.mjs --list：有对应 runner 的直接跑，linux-arm64 无 arm64 runner，
  # 用 docker + QEMU 在 arm64 容器里跑；darwin-x64 既无 runner 也无法模拟，保持"编译产出但不冒烟"。
  smoke-binaries:
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-binaries.outputs.smoke) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries

      - name: Run --version
        if: matrix.platform == ''
        shell: bash
        run: |
          chmod +x "${{ matrix.bin }}"
          "./${{ matrix.bin }}" --version

      - name: Set up QEMU
        if: matrix.platform != ''
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Run --version (${{ matrix.platform }} via QEMU)
        if: matrix.platform != ''
        run: |
          chmod +x "${{ matrix.bin }}"
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$PWD:/work" -w /work ubuntu:24.04 "./${{ matrix.bin }}" --version

  release-binaries:
    needs: smoke-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: release

      # 压缩后再挂 Release：二进制体积由内嵌 bun runtime 决定（具体数值见 README），
      # 压缩能省掉一半以上下载量。checksums 覆盖压缩包本身。
      # 平台清单不在这里重复：直接按 download-artifact 拿到的产物名分派，
      # .exe 走 zip，其余走 tar.gz，唯一来源仍是 scripts/build-bun.mjs 的 TARGETS。
      - name: Package assets
        working-directory: release
        run: |
          set -uo pipefail
          shopt -s failglob
          for f in aforge-*; do
            case "$f" in
              *.exe)
                # Windows 侧给 .zip（Explorer 双击即解）；runner 镜像自带 zip，
                # 缺失时退回 python3 stdlib，避免为一条打包命令依赖额外安装
                if command -v zip > /dev/null; then
                  zip -q "${f%.exe}.zip" "$f"
                  unzip -qt "${f%.exe}.zip" > /dev/null
                else
                  python3 -m zipfile -c "${f%.exe}.zip" "$f"
                  python3 -m zipfile -t "${f%.exe}.zip" > /dev/null
                fi
                ;;
              *)
                # tar 前先补执行位：upload/download-artifact 不保留 mode，
                # 不补的话解包出来的二进制在 POSIX 上不可执行
                chmod +x "$f"
                tar -czf "$f.tar.gz" "$f"
                # 回读校验：rm 之后就没有第二份副本可重来了
                tar -tzf "$f.tar.gz" > /dev/null
                ;;
            esac
            rm "$f"
          done
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2

        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

