name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: windows-latest (primary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Bun 轨道：装依赖 + 单文件 exe
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Node 轨道：typecheck/test 用真 node 跑（vitest 内 spawn process.execPath）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # 依赖统一由 npm ci 装（package-lock.json 是唯一 lockfile 事实源）；
      # bun 只用于 build:bun 的编译步骤，不参与装包。
      - run: npm ci
      - run: npm run gen:version:check
      # lint（biome + src 单文件 500 行体积卡口）只在主 job 跑：结果与平台无关，
      # 三个 job 各跑一遍纯属浪费额度
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # 双轨构建冒烟：esbuild 产物 + bun 编译产物
      - run: npm run build:node
      - run: node dist/aforge.js --version
      - run: npm run build:bun
      - run: ./dist/aforge-win32-x64.exe --version

  ubuntu:
    name: ubuntu-latest (regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run gen:version:check
      - run: npm run typecheck
      - run: npm run test

      - run: npm run build:node
      - run: node dist/aforge.js --version
      - run: npm run build:bun
      - run: ./dist/aforge-linux-x64 --version

  macos:
    name: macos-latest (regression)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run gen:version:check
      - run: npm run typecheck
      - run: npm run test

      - run: npm run build:node
      - run: node dist/aforge.js --version
      # runner 是 arm64（macos-14+），build:bun 取宿主目标即 darwin-arm64
      - run: npm run build:bun
      - run: ./dist/aforge-darwin-arm64 --version


